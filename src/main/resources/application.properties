spring.application.name=spring-thymeleaf-app
server.port=8080

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# DevTools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Persistent local catalog. Override these variables to use the Docker Postgres database.
spring.datasource.url=${CATALOG_DB_URL:jdbc:h2:file:./data/catalog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${CATALOG_DB_USER:sa}
spring.datasource.password=${CATALOG_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Supplier scans at the start of the morning and afternoon shifts.
catalog.refresh.cron=0 0 7,13 * * *
catalog.refresh.zone=Europe/Sofia
