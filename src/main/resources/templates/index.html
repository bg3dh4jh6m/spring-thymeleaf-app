<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar(currentPage='home')}"></aside>

    <!-- Main Content -->
    <div class="main-content">
        <header class="content-header">
            <h1 th:text="${title}">Dashboard</h1>
        </header>

        <div class="content-body">
            <div class="card">
                <h2 th:text="${message}">Welcome to Spring Boot with Thymeleaf!</h2>
                <p class="time">Current server time: <strong th:text="${currentTime}">—</strong></p>
            </div>

            <div class="card">
                <h3>Features</h3>
                <ul class="features">
                    <li th:each="feature : ${features}" th:text="${feature}">Feature</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
